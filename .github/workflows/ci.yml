name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: |
          command -v shellcheck >/dev/null \
            || { sudo apt-get update && sudo apt-get install -y shellcheck; }
      - name: Bash syntax
        run: |
          bash -n Luxus-Python-Stack/scripts/luxuspythonstack.sh \
            tests/test-shell.sh \
            tests/scripts/check-links.sh tests/scripts/check-workflows.sh
      - name: ShellCheck
        run: |
          shellcheck -S warning Luxus-Python-Stack/scripts/luxuspythonstack.sh \
            tests/test-shell.sh \
            tests/scripts/check-links.sh tests/scripts/check-workflows.sh
      - name: Shell tests
        run: bash tests/test-shell.sh
      - name: Link check
        run: bash tests/scripts/check-links.sh
      - name: Workflow lint
        run: bash tests/scripts/check-workflows.sh

  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Shell tests with zsh prompt checks
        run: bash tests/test-shell.sh
      - name: Workflow lint
        run: bash tests/scripts/check-workflows.sh
